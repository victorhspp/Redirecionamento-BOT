<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#111214">
  <title>Verificação Concluída</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #111214;
      color: #f2f3f5;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 40px 30px;
      text-align: center;
      background: #1e1f22;
      border: 1px solid #303136;
      border-radius: 24px;
      box-shadow: 0 20px 60px #0005;
    }

    .check {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #23a55920;
      border: 1px solid #23a55970;
      color: #57f287;
      font-size: 42px;
    }

    .label {
      color: #57f287;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 16px 0 12px;
      font-size: 30px;
      letter-spacing: -1px;
    }

    p {
      margin: 0;
      color: #b5bac1;
      font-size: 15px;
      line-height: 1.7;
    }

    .footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #ffffff12;
      color: #858b94;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="check">✓</div>

    <div class="label">Verificação concluída</div>

    <h1>Você já foi verificado!</h1>

    <p>
      Sua conta foi verificada com sucesso.
      Você já pode voltar ao Discord.
    </p>

    <div class="footer">
      Você pode fechar esta página com segurança.
    </div>
  </main>
</body>
</html>
